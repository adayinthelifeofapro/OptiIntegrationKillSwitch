name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: CMS ${{ matrix.cms }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 12 builds OptiIntegrationKillSwitch (net8.0 + net10.0). 13 builds OptiIntegrationKillSwitch.Cms13 (net10.0).
        cms: ['12', '13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore -p:CmsMajor=${{ matrix.cms }}

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:CmsMajor=${{ matrix.cms }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal -p:CmsMajor=${{ matrix.cms }}

      - name: Pack
        run: |
          VERSION=0.0.0-ci.${{ github.run_number }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          dotnet pack src/Optimizely.IntegrationKillSwitch --configuration Release --no-build \
            -p:CmsMajor=${{ matrix.cms }} -p:Version=$VERSION --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages-cms${{ matrix.cms }}
          path: artifacts/

  publish:
    # One v* tag publishes both packages at the same version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-cms*
          merge-multiple: true
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
